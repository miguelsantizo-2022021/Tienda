<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Ventas</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" style="text-decoration: none; color: white;"><span class="logo">Tienda Miguel 🛒</span></a>
        <div class="user-info">
            <a th:href="@{/Home}" style="color: white; text-decoration: none;">Volver al Panel</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 1100px; margin: 30px auto; padding: 20px;">
    <h1>Historial de Ventas</h1>

    <table style="width: 100%; border-collapse: collapse; background: white; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <thead>
        <tr style="background: #2c3e50; color: white; text-align: left;">
            <th style="padding: 12px;">ID Venta</th>
            <th style="padding: 12px;">Fecha</th>
            <th style="padding: 12px;">Cliente</th>
            <th style="padding: 12px;">Vendedor</th>
            <th style="padding: 12px;">Total</th>
            <th style="padding: 12px;">Estado</th>
            <th style="padding: 12px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${listaVentas}" style="border-bottom: 1px solid #ddd;">
            <td style="padding: 12px;" th:text="${v.idVenta}"></td>
            <td style="padding: 12px;" th:text="${v.fechaVenta}"></td>
            <td style="padding: 12px;" th:text="${v.cliente != null ? v.cliente.nombre : 'S/N'}"></td>
            <td style="padding: 12px;" th:text="${v.usuario != null ? v.usuario.username : 'S/N'}"></td>
            <td style="padding: 12px;"><strong th:text="'Q' + ${v.total}"></strong></td>
            <td style="padding: 12px;">
                    <span th:text="${v.estado == 1 ? 'Completada' : 'Cancelada'}"
                          th:style="${v.estado == 1 ? 'color: green' : 'color: red'}"></span>
            </td>
            <td style="padding: 12px;">
                <a th:href="@{/Ventas/eliminar/{id}(id=${v.idVenta})}"
                   style="color: #dc3545;" onclick="return confirm('¿Eliminar registro de venta?')">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaVentas)}">
            <td colspan="7" style="text-align: center; padding: 20px;">No hay ventas registradas.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
