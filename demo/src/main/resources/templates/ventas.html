<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Ventas</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" style="text-decoration: none; color: white;"><span class="logo">Tienda Miguel 🛒</span></a>
        <div class="user-info">
            <a th:href="@{/Home}" style="color: white; text-decoration: none; margin-right: 15px;">Volver al Panel</a>
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 1100px; margin: 30px auto; padding: 20px;">
    <h1>Historial de Ventas</h1>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID Venta</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Vendedor</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${listaVentas}">
                <td th:text="${v.idVenta}"></td>
                <td th:text="${v.fechaVenta}"></td>
                <td th:text="${v.cliente != null ? v.cliente.nombre : 'S/N'}"></td>
                <td th:text="${v.usuario != null ? v.usuario.username : 'S/N'}"></td>
                <td><strong th:text="'Q' + ${v.total}"></strong></td>
                <td>
                        <span th:text="${v.estado == 1 ? 'Completada' : 'Cancelada'}"
                              th:style="${v.estado == 1 ? 'color: green' : 'color: red'}"></span>
                </td>
                <td>
                    <a th:href="@{/Ventas/eliminar/{id}(id=${v.idVenta})}"
                       class="btn-action btn-delete" onclick="return confirm('¿Eliminar registro de venta?')">
                        <i class="bi bi-trash-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
