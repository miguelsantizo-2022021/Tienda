<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Ventas - Tienda Miguel</title>
    <link rel="stylesheet" th:href="@{/css/StyleGeneral.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" class="logo">
            <i class="bi bi-cart4"></i> Tienda Miguel
        </a>
        <div class="user-actions">
            <a th:href="@{/logout}" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</nav>

<main style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">

    <div style="display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="card">
            <h3><i class="bi bi-search"></i> Buscar Venta por Cliente</h3>
            <form th:action="@{/Ventas}" method="get" style="display: flex; gap: 10px; align-items: center;">
                <input type="text" name="buscar" placeholder="Escribe el nombre del cliente..." th:value="${param.buscar}"
                       style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; flex-grow: 1; margin-bottom: 0;">
                <button type="submit" class="btn-search" style="width: auto; padding: 10px 25px;">Buscar</button>
            </form>
        </div>
    </div>

    <div class="table-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0; color: #112d4c;">Registro Histórico</h2>
            <a th:href="@{/Factura/nueva}" class="btn-add" style="width: auto; padding: 8px 15px; background-color: #3f72af; text-decoration: none;">
                <i class="bi bi-plus-lg"></i> Nueva Factura
            </a>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Vendedor</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${listaVentas}">
                <td th:text="${v.idVenta}" style="font-weight: bold; color: #666;"></td>
                <td th:text="${v.fechaVenta}"></td>
                <td th:text="${v.cliente != null ? v.cliente.nombre : 'Consumidor Final'}"></td>
                <td th:text="${v.usuario != null ? v.usuario.username : 'Sistema'}"></td>
                <td><strong th:text="'Q' + ${v.total}"></strong></td>
                <td>
                    <span th:text="${v.estado == 1 ? 'Completada' : 'Cancelada'}"
                          th:style="${v.estado == 1 ? 'color: #28a745; font-weight: bold;' : 'color: #e84a5f; font-weight: bold;'}">
                    </span>
                </td>
                <td>
                    <a th:href="@{/Ventas/eliminar/{id}(id=${v.idVenta})}"
                       class="btn-action btn-delete" onclick="return confirm('¿Anular este registro de venta?')">
                        <i class="bi bi-trash-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
