<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Ventas - Tienda Miguel</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" style="text-decoration: none; color: white;"><span class="logo">Tienda Miguel 🛒</span></a>
        <div class="user-info">
            <a th:href="@{/Home}" style="color: white; text-decoration: none; margin-right: 15px;">Volver al Panel</a>
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 1200px; margin: 30px auto; padding: 20px;">
    <h1>Registro de Detalles de Ventas</h1>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID Detalle</th>
                <th>ID Venta</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unit.</th>
                <th>Subtotal</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${listaDetalles}">
                <td th:text="${d.idDetalleVenta}"></td>
                <td th:text="${d.venta != null ? d.venta.idVenta : 'N/A'}"></td>
                <td th:text="${d.producto != null ? d.producto.nombreProducto : 'Sin Producto'}"></td>
                <td th:text="${d.cantidad}"></td>
                <td th:text="'Q' + ${d.precioUnitario}"></td>
                <td><strong th:text="'Q' + ${d.subtotal}"></strong></td>
                <td>
                    <a th:href="@{/Detalles/eliminar/{id}(id=${d.idDetalleVenta})}"
                       class="btn-action btn-delete" onclick="return confirm('¿Eliminar detalle?')">
                        <i class="bi bi-trash-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
