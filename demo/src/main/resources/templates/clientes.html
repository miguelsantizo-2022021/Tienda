<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Clientes</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; font-family: sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #333; color: white; }
        tr:hover { background-color: #f5f5f5; }
        .btn-add { background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
        .badge { padding: 5px 10px; border-radius: 4px; color: white; font-size: 0.8em; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" style="text-decoration: none; color: white;">
            <span class="logo">Tienda Miguel 🛒</span>
        </a>

        <div class="user-info">
            <a th:href="@{/Clientes}" style="color: white; margin-right: 15px;">Clientes</a>
            <a th:href="@{/Usuarios}" style="color: white; margin-right: 15px;">Usuarios</a>
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<main class="container">
    <h1>Lista de Clientes</h1>

    <div style="margin-bottom: 20px;">
        <a th:href="@{/Clientes/nuevo}" class="btn-add">➕ Nuevo Cliente</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.idCliente}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.apellido}"></td>
            <td th:text="${c.direccion}"></td>
            <td>
                    <span th:text="${c.estado == 1 ? 'Activo' : 'Inactivo'}"
                          th:style="${c.estado == 1 ? 'color: green' : 'color: red'}"></span>
            </td>
            <td>
                <a th:href="@{/Clientes/eliminar/{id}(id=${c.idCliente})}"
                   style="color: #dc3545;" onclick="return confirm('¿Eliminar cliente?')">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="6" style="text-align: center;">No hay clientes registrados.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
