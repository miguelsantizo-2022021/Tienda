<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Tienda Miguel</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" style="text-decoration: none; color: white;"><span class="logo">Tienda Miguel 🛒</span></a>
        <div class="user-info">
            <a th:href="@{/Home}" style="color: white; text-decoration: none; margin-right: 20px;">Volver al Panel</a>
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 1100px; margin: 30px auto; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Lista de Clientes</h1>
        <a th:href="@{/Clientes/nuevo}" class="btn-add">
            <i class="bi bi-person-plus-fill"></i> Nuevo Cliente
        </a>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Dirección</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.idCliente}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.apellido}"></td>
                <td th:text="${c.direccion}"></td>
                <td>
                        <span th:text="${c.estado == 1 ? 'Activo' : 'Inactivo'}"
                              th:style="${c.estado == 1 ? 'color: green' : 'color: red'}"></span>
                </td>
                <td>
                    <a th:href="@{/Clientes/eliminar/{id}(id=${c.idCliente})}"
                       class="btn-action btn-delete" onclick="return confirm('¿Eliminar?')">
                        <i class="bi bi-trash-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
