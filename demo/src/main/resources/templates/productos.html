<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Tienda Miguel</title>
    <link rel="stylesheet" th:href="@{/css/StyleGeneral.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" class="logo">
            <i class="bi bi-cart4"></i> Tienda Miguel
        </a>
        <div class="user-actions">
            <a th:href="@{/logout}" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</nav>

<main style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">

        <div class="card">
            <h3 th:text="${productoObj.idProducto != null ? 'Editar Producto' : 'Nuevo Producto'}">Gestión de Producto</h3>
            <form th:action="@{/Productos/guardar}" th:object="${productoObj}" method="post" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="hidden" th:field="*{idProducto}">
                <input type="text" th:field="*{nombreProducto}" placeholder="Nombre del Producto" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <input type="number" step="0.01" th:field="*{precio}" placeholder="Precio (Q)" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <input type="number" th:field="*{stock}" placeholder="Stock" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">

                <select th:field="*{estado}" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; background: white;">
                    <option value="1">Disponible</option>
                    <option value="0">Agotado</option>
                </select>
                <button type="submit" class="btn-add">Guardar Cambios</button>
            </form>
        </div>

        <div class="card">
            <h3>Buscar en Inventario</h3>
            <form th:action="@{/Productos}" method="get" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" name="buscar" placeholder="Nombre del producto..." th:value="${param.buscar}" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <button type="submit" class="btn-search">Buscar Producto</button>
            </form>
        </div>

    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${listaProductos}">
                <td th:text="${p.idProducto}"></td>
                <td th:text="${p.nombreProducto}"></td>
                <td th:text="'Q' + ${p.precio}"></td>
                <td>
                    <span th:text="${p.stock}" th:style="${p.stock < 5 ? 'color: #e84a5f; font-weight: bold;' : ''}"></span>
                </td>
                <td>
                        <span th:text="${p.estado == 1 ? 'Disponible' : 'Agotado'}"
                              th:style="${p.estado == 1 ? 'color: #28a745; font-weight: bold;' : 'color: #e84a5f; font-weight: bold;'}">
                        </span>
                </td>
                <td>
                    <a th:href="@{/Productos/editar/{id}(id=${p.idProducto})}" class="btn-action btn-edit">
                        <i class="bi bi-pencil-fill"></i>
                    </a>
                    <a th:href="@{/Productos/eliminar/{id}(id=${p.idProducto})}" class="btn-action btn-delete"
                       onclick="return confirm('¿Eliminar producto?')">
                        <i class="bi bi-trash-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
