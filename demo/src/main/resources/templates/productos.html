<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Productos</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" style="text-decoration: none; color: white;"><span class="logo">Tienda Miguel 🛒</span></a>
        <div class="user-info">
            <a th:href="@{/Home}" style="color: white; text-decoration: none;">Volver al Panel</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 1100px; margin: 30px auto; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Inventario de Productos</h1>
        <a th:href="@{/Productos/nuevo}" style="background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">
            <i class="bi bi-plus-circle"></i> Nuevo Producto
        </a>
    </div>

    <table style="width: 100%; border-collapse: collapse; background: white; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <thead>
        <tr style="background: #2c3e50; color: white; text-align: left;">
            <th style="padding: 12px;">ID</th>
            <th style="padding: 12px;">Producto</th>
            <th style="padding: 12px;">Precio</th>
            <th style="padding: 12px;">Stock</th>
            <th style="padding: 12px;">Estado</th>
            <th style="padding: 12px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${listaProductos}" style="border-bottom: 1px solid #ddd;">
            <td style="padding: 12px;" th:text="${p.idProducto}"></td>
            <td style="padding: 12px;" th:text="${p.nombreProducto}"></td>
            <td style="padding: 12px;" th:text="'Q' + ${p.precio}"></td>
            <td style="padding: 12px;">
                    <span th:text="${p.stock}"
                          th:style="${p.stock < 5 ? 'color: red; font-weight: bold;' : 'color: black;'}"></span>
            </td>
            <td style="padding: 12px;">
                    <span th:text="${p.estado == 1 ? 'Disponible' : 'Agotado'}"
                          th:style="${p.estado == 1 ? 'color: green' : 'color: red'}"></span>
            </td>
            <td style="padding: 12px;">
                <a th:href="@{/Productos/eliminar/{id}(id=${p.idProducto})}"
                   style="color: #dc3545;" onclick="return confirm('¿Eliminar este producto?')">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaProductos)}">
            <td colspan="6" style="text-align: center; padding: 20px;">No hay productos en el inventario.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
