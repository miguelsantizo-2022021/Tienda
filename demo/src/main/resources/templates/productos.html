<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Productos</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" style="text-decoration: none; color: white;"><span class="logo">Tienda Miguel 🛒</span></a>
        <div class="user-info">
            <a th:href="@{/Home}" style="color: white; text-decoration: none; margin-right: 15px;">Volver al Panel</a>
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 1100px; margin: 30px auto; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Inventario de Productos</h1>
        <a th:href="@{/Productos/nuevo}" class="btn-add">
            <i class="bi bi-plus-circle"></i> Nuevo Producto
        </a>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${listaProductos}">
                <td th:text="${p.idProducto}"></td>
                <td th:text="${p.nombreProducto}"></td>
                <td th:text="'Q' + ${p.precio}"></td>
                <td>
                        <span th:text="${p.stock}"
                              th:style="${p.stock < 5 ? 'color: red; font-weight: bold;' : 'color: black;'}"></span>
                </td>
                <td>
                        <span th:text="${p.estado == 1 ? 'Disponible' : 'Agotado'}"
                              th:style="${p.estado == 1 ? 'color: green' : 'color: red'}"></span>
                </td>
                <td>
                    <a th:href="@{/Productos/eliminar/{id}(id=${p.idProducto})}"
                       class="btn-action btn-delete" onclick="return confirm('¿Eliminar este producto?')">
                        <i class="bi bi-trash-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
