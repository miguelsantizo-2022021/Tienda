<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Tienda Miguel</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .container { max-width: 1100px; margin: 30px auto; padding: 20px; font-family: sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.85em; color: white; }
        .bg-active { background-color: #28a745; }
        .bg-inactive { background-color: #dc3545; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" style="text-decoration: none; color: white;">
            <span class="logo">Tienda Miguel 🛒</span>
        </a>

        <div class="user-info">
            <a th:href="@{/Clientes}" style="color: white; margin-right: 15px;">Clientes</a>
            <a th:href="@{/Usuarios}" style="color: white; margin-right: 15px;">Usuarios</a>
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<main class="container">
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Mantenimiento de Usuarios</h1>
        <a th:href="@{/Usuarios/nuevo}" style="background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">
            <i class="bi bi-person-plus-fill"></i> Nuevo Usuario
        </a>
    </header>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${listaUsuarios}">
            <td th:text="${u.idUsuario}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td><strong th:text="${u.rol}"></strong></td>
            <td>
                    <span th:class="${u.estado == 1 ? 'status-pill bg-active' : 'status-pill bg-inactive'}"
                          th:text="${u.estado == 1 ? 'Activo' : 'Inactivo'}">
                    </span>
            </td>
            <td>
                <a th:href="@{/Usuarios/eliminar/{id}(id=${u.idUsuario})}"
                   style="color: #dc3545; font-size: 1.2em;" onclick="return confirm('¿Eliminar este usuario?')">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaUsuarios)}">
            <td colspan="6" style="text-align: center; color: #666;">No hay usuarios registrados en el sistema.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
