<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Tienda Miguel</title>
    <link rel="stylesheet" th:href="@{/css/StyleGeneral.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" class="logo">
            <i class="bi bi-cart4"></i> Tienda Miguel
        </a>
        <div class="user-actions">
            <a th:href="@{/logout}" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</nav>

<main style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">

        <div class="card">
            <h3 th:text="${usuarioObj.idUsuario != null ? 'Editar Usuario' : 'Nuevo Usuario'}">Mantenimiento</h3>
            <form th:action="@{/Usuarios/guardar}" th:object="${usuarioObj}" method="post" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="hidden" th:field="*{idUsuario}">

                <input type="text" th:field="*{username}" placeholder="Username" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <input type="password" th:field="*{password}" placeholder="Password" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <input type="email" th:field="*{email}" placeholder="Email (ejemplo@correo.com)" required style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">

                <select th:field="*{rol}" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; background: white;">
                    <option value="ADMIN">Administrador</option>
                    <option value="USER">Usuario Estándar</option>
                </select>

                <select th:field="*{estado}" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; background: white;">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>

                <button type="submit" class="btn-add">Guardar Usuario</button>
            </form>
        </div>

        <div class="card">
            <h3>Filtrar Usuarios</h3>
            <form th:action="@{/Usuarios}" method="get" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="color: #666; font-size: 0.9rem; margin: 0;">Buscar por nombre de usuario o correo:</p>
                <input type="text" name="buscar" placeholder="Nombre o email..." th:value="${param.buscar}" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <button type="submit" class="btn-search">Buscar Ahora</button>
            </form>
        </div>

    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${listaUsuarios}">
                <td th:text="${u.idUsuario}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td><span class="badge" th:text="${u.rol}" style="background: #3f72af; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;"></span></td>
                <td>
                    <span th:text="${u.estado == 1 ? 'Activo' : 'Inactivo'}"
                          th:style="${u.estado == 1 ? 'color: #28a745; font-weight: bold;' : 'color: #e84a5f; font-weight: bold;'}">
                    </span>
                </td>
                <td>
                    <a th:href="@{/Usuarios/editar/{id}(id=${u.idUsuario})}" class="btn-action btn-edit">
                        <i class="bi bi-pencil-fill"></i>
                    </a>
                    <a th:href="@{/Usuarios/eliminar/{id}(id=${u.idUsuario})}" class="btn-action btn-delete" onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">
                        <i class="bi bi-trash-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
