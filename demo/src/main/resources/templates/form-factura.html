<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Factura - Tienda Miguel</title>
    <link rel="stylesheet" th:href="@{/css/StyleGeneral.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a th:href="@{/Home}" class="logo">
            <i class="bi bi-cart4"></i> Tienda Miguel
        </a>
        <div class="user-actions">
            <a th:href="@{/logout}" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</nav>

<main style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">
    <h2 style="color: #112d4c; margin-bottom: 20px;"><i class="bi bi-receipt"></i> Nueva Factura</h2>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">

        <div class="card">
            <form th:action="@{/Factura/agregar-producto}" method="post">
                <label>Seleccionar Producto:</label>
                <select name="idProducto" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px;">
                    <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombreProducto + ' - Q' + p.precio}"></option>
                </select>
                <button type="submit" class="btn-add" style="background-color: #3f72af;">
                    <i class="bi bi-plus-lg"></i> Agregar a la lista
                </button>
            </form>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <form th:action="@{/Factura/finalizar}" method="post">
                <label>Asignar Cliente:</label>
                <select name="idCliente" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px;" required>
                    <option value="">-- Seleccione Cliente --</option>
                    <option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.nombre}"></option>
                </select>
                <button type="submit" class="btn-add" style="margin-top: 10px;">
                    <i class="bi bi-check-all"></i> Finalizar Venta
                </button>
            </form>
        </div>

        <div class="table-container">
            <h4 style="margin-top: 0;">Detalle de Factura</h4>
            <table style="width: 100%;">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio Unitario</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${carrito}">
                    <td th:text="${item.nombreProducto}"></td>
                    <td th:text="'Q' + ${item.precio}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(carrito)}">
                    <td colspan="2" style="text-align: center; color: #999; padding: 20px;">No hay productos agregados</td>
                </tr>
                </tbody>
            </table>

            <div style="margin-top: 20px; text-align: right; border-top: 2px solid #112d4c; padding-top: 10px;">
                <h3 style="margin: 0;">TOTAL: <span style="color: #e84a5f;" th:text="'Q' + ${totalFactura}"></span></h3>
            </div>
        </div>

    </div>
</main>

</body>
</html>
